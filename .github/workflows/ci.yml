name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install orchestration requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/orchestration/requirements.txt
          pip install -r backend/orchestration/requirements-dev.txt

      - name: Run tests
        working-directory: backend/orchestration
        run: |
          pytest -q
